<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Víctor Yohan Betancourt Marín — Backend, Geospatial &amp; AI Automation Engineer">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1324"/>
    </linearGradient>
    <radialGradient id="glowDark" cx="82%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <pattern id="gridDark" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.55"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="1199" height="219" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="220" fill="url(#bgDark)"/>
    <rect width="1200" height="220" fill="url(#gridDark)"/>
    <rect width="1200" height="220" fill="url(#glowDark)"/>

    <!-- Top hairline accent -->
    <rect x="0" y="0" width="1200" height="3" fill="url(#accentBar)"/>

    <!-- Right-side architectural topology / GIS vector motif -->
    <g transform="translate(825, 22)" opacity="0.92">
      <!-- Subtle territory polygon -->
      <polygon points="90,22 215,10 295,62 272,148 158,166 64,116" fill="#1E293B" fill-opacity="0.38" stroke="#38BDF8" stroke-opacity="0.32" stroke-width="1.2" stroke-dasharray="5 4"/>
      <polygon points="122,48 205,40 248,82 224,132 146,138 106,96" fill="#2563EB" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.24" stroke-width="1"/>

      <!-- Connection edges -->
      <line x1="90" y1="68" x2="184" y2="54" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.4"/>
      <line x1="184" y1="54" x2="262" y2="96" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.4"/>
      <line x1="90" y1="68" x2="162" y2="128" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.2"/>
      <line x1="162" y1="128" x2="262" y2="96" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.2"/>

      <!-- Nodes -->
      <g>
        <circle cx="90" cy="68" r="16" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="90" y="72" text-anchor="middle" fill="#E2E8F0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="600">API</text>
      </g>
      <g>
        <circle cx="184" cy="54" r="18" fill="#0F172A" stroke="#60A5FA" stroke-width="1.6"/>
        <text x="184" y="58" text-anchor="middle" fill="#38BDF8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="700">GIS</text>
      </g>
      <g>
        <circle cx="262" cy="96" r="16" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="262" y="100" text-anchor="middle" fill="#E2E8F0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="600">LLM</text>
      </g>
      <g>
        <circle cx="162" cy="128" r="16" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
        <text x="162" y="132" text-anchor="middle" fill="#6EE7B7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="600">WAL</text>
      </g>

      <!-- Coordinate metadata tag -->
      <text x="180" y="176" text-anchor="middle" fill="#64748B" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="0.8">CQRS · POSTGIS · DECIMAL · CI</text>
    </g>

    <!-- Left typography block -->
    <g transform="translate(46, 36)">
      <!-- Eyebrow status pill -->
      <rect x="0" y="0" width="356" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="15" cy="13" r="4" fill="#10B981"/>
      <text x="28" y="17" fill="#CBD5E1" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" letter-spacing="0.6">QUANTICO SYSTEMS · GMT-4 REMOTE</text>

      <!-- Name -->
      <text x="0" y="75" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.6">Víctor Yohan Betancourt Marín</text>

      <!-- Role subtitle -->
      <text x="0" y="109" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500">Backend, Geospatial &amp; AI Automation Engineer</text>

      <!-- Subtle divider -->
      <rect x="0" y="128" width="72" height="3" rx="1.5" fill="url(#accentBar)"/>

      <!-- Compact mono stack line -->
      <text x="0" y="157" fill="#7DD3FC" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" letter-spacing="0.2">Python / FastAPI · Go · TypeScript · PostGIS · Redis · Docker</text>
    </g>
  </g>

  <!-- Crisp outer border -->
  <rect x="0.5" y="0.5" width="1199" height="219" rx="14" fill="none" stroke="#30363D" stroke-width="1"/>
</svg>
